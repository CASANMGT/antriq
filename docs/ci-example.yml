# Copy this file to .github/workflows/ci.yml
# It is kept outside .github because a GitHub token without the `workflow`
# scope cannot push workflow files. Once your token has that scope, move it back.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          AUTH_SECRET: ci-only-secret-do-not-use-in-production
          # The build does not query the database (all app pages are dynamic),
          # so no DATABASE_URL is required here.
